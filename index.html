<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travis Henderson Professional Cricket Coaching</title>

<style>
:root{
  --navy:#071a36;
  --navy2:#0d2a50;
  --cyan:#08c7ee;
  --cyan2:#6de7ff;
  --red:#ef3827;
  --white:#f7fbff;
  --muted:#9db0c8;
  --line:rgba(255,255,255,.1);
  --good:#5ee49b;
  --warn:#ffd166;
  --shadow:0 20px 55px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,#103d70 0,#071a36 32%,#030b18 100%);
  color:var(--white);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

.topbar{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 24px;
  border-bottom:1px solid var(--line);
  background:rgba(3,11,24,.85);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:50%;
}

.brand strong{
  font-size:15px;
  letter-spacing:.3px;
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.mode{
  display:flex;
  background:#06152b;
  border:1px solid var(--line);
  padding:4px;
  border-radius:12px;
}

.mode button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 13px;
  border-radius:9px;
}

.mode button.active{
  background:var(--cyan);
  color:#02111f;
  font-weight:800;
}

.shell{
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:calc(100vh - 76px);
}

.side{
  border-right:1px solid var(--line);
  padding:22px 14px;
  background:rgba(4,15,31,.5);
}

.side h4{
  margin:8px 12px 12px;
  color:#6f89a7;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.navbtn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#bfd0e4;
  padding:12px 14px;
  border-radius:11px;
  margin:2px 0;
}

.navbtn:hover,
.navbtn.active{
  background:rgba(8,199,238,.12);
  color:var(--white);
}

.navbtn.active{
  box-shadow:inset 3px 0 var(--cyan);
}

.main{
  padding:28px;
  max-width:1500px;
  width:100%;
  margin:auto;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:22px;
}

.eyebrow{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.8px;
  text-transform:uppercase;
}

.hero h1{
  font-size:32px;
  margin:5px 0;
  line-height:1.1;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:#0b2548;
  color:var(--white);
  padding:10px 14px;
  border-radius:10px;
}

.btn.primary{
  background:linear-gradient(135deg,var(--cyan),#0696d6);
  color:#02111f;
  border:0;
  font-weight:850;
}

.btn.red{
  background:rgba(239,56,39,.14);
  border-color:rgba(239,56,39,.3);
  color:#ff8e83;
}

.btn:hover{
  transform:translateY(-1px);
}

.grid{
  display:grid;
  gap:16px;
}

.stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.two{
  grid-template-columns:1.4fr .9fr;
}

.three{
  grid-template-columns:repeat(3,1fr);
}

.card{
  background:linear-gradient(
    145deg,
    rgba(13,42,80,.84),
    rgba(5,21,43,.86)
  );
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:18px;
}

.stat .label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat .value{
  font-size:29px;
  font-weight:850;
  margin:8px 0 4px;
}

.stat .sub{
  font-size:12px;
  color:#8fa8c2;
}

.positive{
  color:var(--good);
}

.warning{
  color:var(--warn);
}

.danger{
  color:#ff7f74;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.section-title h2{
  font-size:16px;
  margin:0;
}

.section-title span{
  font-size:11px;
  color:var(--muted);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

th{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#7891ad;
}

td strong{
  font-size:13px;
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:99px;
  background:rgba(8,199,238,.1);
  border:1px solid rgba(8,199,238,.18);
  color:#82eaff;
  font-size:10px;
  font-weight:800;
}

.pill.red{
  background:rgba(239,56,39,.1);
  border-color:rgba(239,56,39,.2);
  color:#ff9b91;
}

.pill.green{
  background:rgba(94,228,155,.08);
  border-color:rgba(94,228,155,.2);
  color:#7ff0af;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.field label{
  display:block;
  color:#8da4bf;
  font-size:11px;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  background:#06172f;
  border:1px solid var(--line);
  color:var(--white);
  border-radius:10px;
  padding:10px 11px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field.full{
  grid-column:1/-1;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.login{
  max-width:460px;
  margin:8vh auto;
}

.login .logo{
  width:115px;
  height:115px;
  display:block;
  margin:0 auto 16px;
  border-radius:50%;
}

.login h1{
  text-align:center;
  font-size:27px;
}

.login p{
  text-align:center;
  color:var(--muted);
}

.loginbox{
  margin-top:22px;
}

.bigpin{
  font-size:24px;
  letter-spacing:9px;
  text-align:center;
}

.small{
  font-size:11px;
  color:var(--muted);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:25px;
}

.note{
  border-left:3px solid var(--cyan);
  padding:10px 12px;
  background:rgba(8,199,238,.05);
  border-radius:0 10px 10px 0;
  margin-bottom:10px;
}

.note.private{
  border-left-color:var(--red);
  background:rgba(239,56,39,.05);
}

.feature{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:rgba(8,199,238,.1);
  color:var(--cyan);
  font-weight:900;
}

.chart{
  height:170px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:15px 5px 4px;
}

.barcol{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  height:100%;
  justify-content:flex-end;
}

.barcol i{
  display:block;
  width:70%;
  max-width:45px;
  border-radius:7px 7px 2px 2px;
  background:linear-gradient(180deg,var(--cyan2),#087db7);
  min-height:8px;
}

.barcol small{
  color:#7992ad;
  font-size:9px;
}

.scoreline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#0b294c;
  border:1px solid rgba(8,199,238,.3);
  box-shadow:var(--shadow);
  padding:12px 15px;
  border-radius:12px;
  display:none;
  z-index:50;
}

.toast.show{
  display:block;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:40;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
}

.footer{
  text-align:center;
  color:#607994;
  font-size:10px;
  padding:25px 0;
}

@media(max-width:950px){
  .shell{
    grid-template-columns:1fr;
  }

  .side{
    display:none;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .two,
  .three{
    grid-template-columns:1fr;
  }

  .main{
    padding:18px;
  }

  .hero{
    align-items:flex-start;
    flex-direction:column;
  }

  .formgrid{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stats .value{
    font-size:23px;
  }

  .mode button{
    padding:8px 9px;
    font-size:11px;
  }

  .brand strong{
    font-size:12px;
  }

  .topbar{
    height:68px;
    padding:9px 14px;
  }

  .main{
    padding:13px;
  }

  .card{
    padding:14px;
  }

  .hero h1{
    font-size:25px;
  }

  table{
    display:block;
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<div class="app">

</div>

/* =========================
   BASIC FUNCTIONS
========================= */

const $ = id => document.getElementById(id);

function toast(message){

  $("toast").textContent = message;

  $("toast").classList.add("show");

  setTimeout(()=>{
    $("toast").classList.remove("show");
  },2500);

}


function player(id){

  return players.find(p => p.id === id);

}


function playerMatches(id){

  return matches.filter(m => m.player === id);

}


/* =========================
   STATISTICS
========================= */

function battingAverage(id){

  const ms = playerMatches(id);

  const dismissals = ms.filter(
    m => m.dismissal !== "Not out"
  ).length;

  const runs = ms.reduce(
    (total,m)=>total + Number(m.runs || 0),
    0
  );

  if(!dismissals) return runs.toFixed(1);

  return (runs / dismissals).toFixed(1);

}


function strikeRate(id){

  const ms = playerMatches(id);

  const runs = ms.reduce(
    (total,m)=>total + Number(m.runs || 0),
    0
  );

  const balls = ms.reduce(
    (total,m)=>total + Number(m.balls || 0),
    0
  );

  if(!balls) return "0.0";

  return ((runs / balls) * 100).toFixed(1);

}


function bowlingAverage(id){

  const ms = playerMatches(id);

  const wickets = ms.reduce(
    (total,m)=>total + Number(m.wickets || 0),
    0
  );

  const runs = ms.reduce(
    (total,m)=>total + Number(m.runsConceded || 0),
    0
  );

  if(!wickets) return "0.0";

  return (runs / wickets).toFixed(1);

}


function economy(id){

  const ms = playerMatches(id);

  const runs = ms.reduce(
    (total,m)=>total + Number(m.runsConceded || 0),
    0
  );

  const overs = ms.reduce(
    (total,m)=>total + Number(m.overs || 0),
    0
  );

  if(!overs) return "0.0";

  return (runs / overs).toFixed(1);

}


/* =========================
   LOGIN / MODE
========================= */

function setMode(newMode){

  mode = newMode;

  $("parentMode").classList.toggle(
    "active",
    mode === "parent"
  );

  $("coachMode").classList.toggle(
    "active",
    mode === "coach"
  );

  $("loginTitle").textContent =
    mode === "parent"
      ? "Parent Portal"
      : "Coach Portal";

  $("loginCopy").textContent =
    mode === "parent"
      ? "Enter your family PIN to access your player's match record."
      : "Enter your coach PIN to open the academy dashboard.";

  logout();

}


function login(){

  if($("pin").value !== "1234"){

    toast("Demo PIN: 1234");

    return;

  }

  logged = true;

  $("loginPage").classList.remove("active");

  buildSidebar();

  show(
    mode === "parent"
      ? "parentDashboard"
      : "coachDashboard"
  );

}


function logout(){

  logged = false;

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  $("loginPage").classList.add("active");

  buildSidebar();

}


/* =========================

========================= */

function buildSidebar(){

  const sidebar = $("sidebar");

  if(!logged){

        Secure academy portal
      </div>`;

    return;

  }

  if(mode === "parent"){

    sidebar.innerHTML = `

      <button class="navbtn" onclick="show('playerProfile')">
        ◉ Player profile

      <button class="navbtn" onclick="show('submitMatch')">
        ＋ Submit match
      </button>

      <button class="navbtn" onclick="show('parentHistory')">
        ▤ Match history
      </button>

      <button class="navbtn" onclick="show('parentInvoices')">
        R Invoices
      </button>

}


function show(id){

  if(!logged) return;

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  $(id).classList.add("active");

  render(id);

  buildSidebar();

}

      style="margin-top:15px">

      ${stat(
        "Runs",
        m.runs,
        `off ${m.balls}`
      )}

      ${stat(
        "Wickets",
        m.wickets,
        `${m.overs} overs`
      )}

      ${stat(
        "Runs conceded",
        m.runsConceded,
        "Bowling"
      )}

    </div>


    <div
      class="formgrid"
      style="margin-top:15px">

      <div class="field">

        <label>Dismissal</label>

        <select id="rDismiss">

          <option ${
            m.dismissal === "Not out"
              ? "selected"
              : ""
          }>
            Not out
          </option>

          <option ${
            m.dismissal === "Caught"
              ? "selected"
              : ""
          }>
            Caught
          </option>

          <option ${
            m.dismissal === "Bowled"
              ? "selected"
              : ""
          }>
            Bowled
          </option>

          <option ${
            m.dismissal === "LBW"
              ? "selected"
              : ""
          }>
            LBW
          </option>

          <option ${
            m.dismissal === "Run out"
              ? "selected"
              : ""
          }>
            Run out
          </option>

          <option ${
            m.dismissal === "Stumped"
              ? "selected"
              : ""
          }>
            Stumped
          </option>

        </select>

      </div>


      <div class="field">

        <label>Coach status</label>

        <select id="rStatus">

          <option ${
            m.status === "approved"
              ? "selected"
              : ""
          }>
            approved
          </option>

          <option ${
            m.status === "pending"
              ? "selected"
              : ""
          }>
            pending
          </option>

        </select>

      </div>

    </div>


    <div
      style="
        display:flex;
        justify-content:flex-end;
        gap:8px;
        margin-top:15px
      ">

      <button
        class="btn primary"
        onclick="approveMatch(${id})">

        Save review

      </button>

    </div>

  `;

  $("modal").classList.add("show");

}


function approveMatch(id){

  const m =
    matches.find(x=>x.id === id);

  m.status =
    $("rStatus").value;

  m.dismissal =
    $("rDismiss").value;

  closeModal();

  toast("Match review saved");

  show("coachMatches");

}


function closeModal(){

  $("modal").classList.remove("show");

}


/* =========================
   COACH NOTES
========================= */

function coachNotes(){

  $("coachNotes").innerHTML =

    shell(
      "Coaching notes",
      "Keep private coach observations separate from parent-visible development notes."
    )

    +

    `<div class="grid two">

      <div class="card">

        <div class="section-title">

          <h2>Parent-visible notes</h2>

          <span>Shared</span>

        </div>

        ${
          notes
          .filter(n=>!n.private)
          .map(n=>`

            <div class="note">

              <b>${n.player}</b>

              <br>

              <span class="small">
                ${n.text}
              </span>

            </div>

          `)
          .join("")
          ||
          `<div class="empty">
            No shared notes.
          </div>`
        }

      </div>


      <div class="card">

        <div class="section-title">

          <h2>Private coach notes</h2>

          <span>Coach only</span>

        </div>

        ${
          notes
          .filter(n=>n.private)
          .map(n=>`

            <div class="note private">

              <b>${n.player}</b>

              <br>

              <span class="small">
                ${n.text}
              </span>

            </div>

          `)
          .join("")
          ||
          `<div class="empty">
            No private notes.
          </div>`
        }

      </div>

    </div>`;

}


/* =========================
   COACH INVOICES
========================= */

function coachInvoices(){

  $("coachInvoices").innerHTML =

    shell(
      "Invoice control",
      "Update payment status and the balance shown to families."
    )

    +

    `<div class="card">

      <table>

        <thead>

          <tr>
            <th>Player</th>
            <th>Invoice</th>
            <th>Paid</th>
            <th>Balance</th>
            <th>Status</th>
            <th></th>
          </tr>

        </thead>

        <tbody>

          ${
            invoices.map((i,index)=>`

              <tr>

                <td>
                  <strong>${i.player}</strong>
                </td>

                <td>
                  R ${i.amount.toLocaleString()}
                </td>

                <td>
                  R ${i.paid.toLocaleString()}
                </td>

                <td>
                  R ${(i.amount-i.paid)
                    .toLocaleString()}
                </td>

                <td>

                  <span class="pill ${
                    i.status === "Paid"
                      ? "green"
                      : "red"
                  }">

                    ${i.status}

                  </span>

                </td>

                <td>

                  <button
                    class="btn"
                    onclick="toggleInvoice(${index})">

                    ${
                      i.status === "Paid"
                        ? "Mark outstanding"
                        : "Mark paid"
                    }

                  </button>

                </td>

              </tr>

            `).join("")
          }

        </tbody>

      </table>

    </div>`;

}


function toggleInvoice(index){

  const invoice =
    invoices[index];

  if(invoice.status === "Paid"){

    invoice.paid = 0;
    invoice.status = "Outstanding";

  }else{

    invoice.paid = invoice.amount;
    invoice.status = "Paid";

  }

  toast("Invoice status updated");

  render("coachInvoices");

}


/* =========================
   START APP
========================= */

buildSidebar();

</script>

</body>
        </html>
