<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madibaz Youth Analytics</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 3. Babel for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. Recharts & Prop-Types -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { 
      BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, 
      PieChart, Pie, Cell 
    } = Recharts;

    const playerStats = {
      name: "Liam Henderson",
      role: "All-Rounder (Fast Bowler / Middle Order Batter)",
      matches: 12,
      batting: {
        runs: 384,
        ballsFaced: 295,
        strikeRate: 130.17,
        average: 38.4,
        controlIndex: 72.5,
        selfOutCount: 3,
        goodBallOutCount: 7,
        dismissalByLength: [
          { length: 'Short/Bouncer', count: 1, percentage: 10 },
          { length: 'Good Length', count: 2, percentage: 20 },
          { length: 'Full Pitch Up', count: 5, percentage: 50 },
          { length: 'Yorker', count: 2, percentage: 20 },
        ],
        fieldingCatchZones: [
          { position: 'Cover / Mid-Off Ring', count: 5, riskLevel: 'High' },
          { position: 'Slips / Keeper', count: 2, riskLevel: 'Low' },
          { position: 'Deep Mid-Wicket', count: 1, riskLevel: 'Medium' },
        ]
      },
      bowling: {
        overs: 48.0,
        maidens: 6,
        runsConceded: 216,
        wickets: 19,
        economy: 4.50,
        dotBallPercentage: 62.5,
        wicketQuality: [
          { name: 'Good Delivery / Plan Executed', value: 14, color: '#10B981' },
          { name: 'Batter Error / Loose Shot', value: 5, color: '#F59E0B' }
        ],
        wicketTypes: [
          { mode: 'Bowled / LBW (Stump-to-Stump)', count: 9 },
          { mode: 'Caught Behind / Slips', count: 6 },
          { mode: 'Outfield Catches', count: 4 }
        ]
      },
      fielding: {
        catchesTaken: 8,
        catchesDropped: 1,
        catchConversion: 88.8,
        runOutInvolvements: 3,
        directHits: 2,
        runsSavedNet: 24
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('parent');

      const [formData, setFormData] = useState({
        playerName: '',
        matchDate: new Date().toISOString().split('T')[0],
        runs: '',
        balls: '',
        isOut: 'Out',
        dismissalMode: 'Caught',
        caughtPosition: 'Cover / Mid-Off Ring',
        dismissalLine: 'Outside Off',
        dismissalLength: 'Full Pitch Up',
        dismissalAssessment: 'Got self out',
        overs: '',
        maidens: '',
        bowlingRuns: '',
        wickets: '',
        catches: '0',
        drops: '0',
        runOuts: '0'
      });

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
          {/* Header Navigation */}
          <header className="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
            <div>
              <h1 className="text-2xl font-bold tracking-tight text-emerald-400">Madibaz Youth Analytics</h1>
              <p className="text-sm text-slate-400">High-Performance Cricket Development Portal</p>
            </div>
            <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setActiveTab('parent')}
                className={`px-5 py-2 rounded-lg text-sm font-medium transition-all ${
                  activeTab === 'parent' 
                    ? 'bg-emerald-500 text-slate-950 font-semibold shadow-lg' 
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Parent Entry & View
              </button>
              <button
                onClick={() => setActiveTab('coach')}
                className={`px-5 py-2 rounded-lg text-sm font-medium transition-all ${
                  activeTab === 'coach' 
                    ? 'bg-emerald-500 text-slate-950 font-semibold shadow-lg' 
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Coach Hyper-Analytics
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto">
            {/* PARENT VIEW */}
            {activeTab === 'parent' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                {/* Input Form Column */}
                <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <div className="mb-6 pb-4 border-b border-slate-800">
                    <h2 className="text-lg font-semibold text-white">Post-Match Parent Entry</h2>
                    <p className="text-xs text-slate-400">Fast, 2-minute logging after match day</p>
                  </div>

                  <form className="space-y-6">
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Player Name</label>
                        <input 
                          type="text" 
                          name="playerName"
                          value={formData.playerName}
                          onChange={handleInputChange}
                          placeholder="e.g. Liam Henderson" 
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Match Date</label>
                        <input 
                          type="date" 
                          name="matchDate"
                          value={formData.matchDate}
                          onChange={handleInputChange}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>

                    {/* 1. BATTING */}
                    <div className="border border-slate-800 bg-slate-950/50 p-4 rounded-xl space-y-4">
                      <h3 className="text-sm font-semibold text-emerald-400">1. Batting Statistics</h3>
                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Runs Scored</label>
                          <input type="number" name="runs" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Balls Faced</label>
                          <input type="number" name="balls" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Status</label>
                          <select name="isOut" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                            <option>Out</option>
                            <option>Not Out</option>
                            <option>Retired</option>
                          </select>
                        </div>
                      </div>

                      <div className="pt-2 border-t border-slate-800 space-y-3">
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs text-slate-400 mb-1">Dismissal Mode</label>
                            <select name="dismissalMode" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                              <option>Caught</option>
                              <option>Bowled</option>
                              <option>LBW</option>
                              <option>Run Out</option>
                              <option>Stumped</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs text-slate-400 mb-1">Fielding Catch Zone</label>
                            <select name="caughtPosition" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                              <option>Slip / Gully</option>
                              <option>Point / Cover Ring</option>
                              <option>Mid-Off / Mid-On</option>
                              <option>Mid-Wicket / Square Leg</option>
                              <option>Deep Boundary</option>
                              <option>Wicketkeeper</option>
                            </select>
                          </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3">
                          <div>
                            <label className="block text-xs text-slate-400 mb-1">Delivery Line</label>
                            <select name="dismissalLine" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                              <option>Outside Off</option>
                              <option>Stumps / Straight</option>
                              <option>Down Leg</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs text-slate-400 mb-1">Delivery Length</label>
                            <select name="dismissalLength" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                              <option>Full Pitch Up</option>
                              <option>Good Length</option>
                              <option>Short / Bouncer</option>
                              <option>Yorker / Full Toss</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs text-slate-400 mb-1">Assessment</label>
                            <select name="dismissalAssessment" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                              <option>Got self out (Execution error)</option>
                              <option>Good ball (Unplayable delivery)</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* 2. BOWLING */}
                    <div className="border border-slate-800 bg-slate-950/50 p-4 rounded-xl space-y-4">
                      <h3 className="text-sm font-semibold text-emerald-400">2. Bowling Statistics</h3>
                      <div className="grid grid-cols-4 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Overs</label>
                          <input type="number" step="0.1" placeholder="4.0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Maidens</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Runs</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Wickets</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                      </div>
                    </div>

                    {/* 3. FIELDING */}
                    <div className="border border-slate-800 bg-slate-950/50 p-4 rounded-xl space-y-4">
                      <h3 className="text-sm font-semibold text-emerald-400">3. Fielding Involvements</h3>
                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Catches Held</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Catches Dropped</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Run Out Involvements</label>
                          <input type="number" placeholder="0" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                        </div>
                      </div>
                    </div>

                    <button 
                      type="button" 
                      className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg"
                    >
                      Submit Match Entry
                    </button>
                  </form>
                </div>

                {/* Parent Summary Column */}
                <div className="lg:col-span-5 space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h2 className="text-lg font-semibold text-white mb-1">Player Summary</h2>
                    <p className="text-xs text-slate-400 mb-6">Clean season totals for parents</p>

                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <p className="text-xs text-slate-400 mb-1">Batting Average</p>
                        <p className="text-2xl font-bold text-white">{playerStats.batting.average}</p>
                        <span className="text-xs text-emerald-400 font-medium">SR: {playerStats.batting.strikeRate}</span>
                      </div>
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <p className="text-xs text-slate-400 mb-1">Season Wickets</p>
                        <p className="text-2xl font-bold text-white">{playerStats.bowling.wickets}</p>
                        <span className="text-xs text-emerald-400 font-medium">Econ: {playerStats.bowling.economy}</span>
                      </div>
                    </div>

                    <div className="space-y-3 border-t border-slate-800 pt-4">
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-slate-400">Total Season Runs:</span>
                        <span className="font-semibold text-white">{playerStats.batting.runs}</span>
                      </div>
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-slate-400">Catch Efficiency:</span>
                        <span className="font-semibold text-emerald-400">{playerStats.fielding.catchConversion}%</span>
                      </div>
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-slate-400">Run Out Involvements:</span>
                        <span className="font-semibold text-white">{playerStats.fielding.runOutInvolvements}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* COACH VIEW */}
            {activeTab === 'coach' && (
              <div className="space-y-8">
                {/* Stats Ribbon */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Control Index (CEI)</span>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">{playerStats.batting.controlIndex}%</p>
                    <p className="text-[10px] text-slate-500 mt-1">% Wickets lost to good balls vs mistakes</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Bowling Dot Ball %</span>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">{playerStats.bowling.dotBallPercentage}%</p>
                    <p className="text-[10px] text-slate-500 mt-1">Pressure metric per spell</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Execution Strike Rate</span>
                    <p className="text-2xl font-bold text-white mt-1">15.1</p>
                    <p className="text-[10px] text-slate-500 mt-1">Balls per earned wicket</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Fielding Net Impact</span>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">+{playerStats.fielding.runsSavedNet} Runs</p>
                    <p className="text-[10px] text-slate-500 mt-1">Estimated net runs saved in field</p>
                  </div>
                </div>

                {/* Tactical Alert */}
                <div className="bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl">
                  <h4 className="text-sm font-semibold text-amber-400">Automated Tactical Insight for Head Coach</h4>
                  <p className="text-xs text-slate-300 mt-1">
                    <strong>Batting Flaw Detected:</strong> 50% of player dismissals occur on <em>Full / Pitch-Up</em> deliveries targeted <em>Outside Off</em>, with 62% resulting in airborne catches in the Cover/Mid-Off ring. Recommended focus: front-foot driving mechanics & ground-hitting drills.
                  </p>
                </div>

                {/* Charts Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {/* Chart 1 */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 className="text-base font-semibold text-white mb-1">Batting Dismissal Vulnerability by Length</h3>
                    <p className="text-xs text-slate-400 mb-6">Distribution of how the batter gets out based on ball length</p>
                    <div className="h-64">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={playerStats.batting.dismissalByLength} layout="vertical">
                          <XAxis type="number" stroke="#64748b" fontSize={12} />
                          <YAxis dataKey="length" type="category" stroke="#64748b" fontSize={12} width={100} />
                          <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155' }} />
                          <Bar dataKey="percentage" fill="#10B981" radius={[0, 4, 4, 0]} />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* Chart 2 */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 className="text-base font-semibold text-white mb-1">Bowling Wicket Quality Index</h3>
                    <p className="text-xs text-slate-400 mb-6">Wickets earned via executed plans vs batter unforced errors</p>
                    <div className="h-64 flex items-center justify-center">
                      <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                          <Pie
                            data={playerStats.bowling.wicketQuality}
                            cx="50%"
                            cy="50%"
                            innerRadius={60}
                            outerRadius={80}
                            paddingAngle={5}
                            dataKey="value"
                          >
                            {playerStats.bowling.wicketQuality.map((entry, index) => (
                              <Cell key={`cell-${index}`} fill={entry.color} />
                            ))}
                          </Pie>
                          <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155' }} />
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                    <div className="flex justify-center gap-6 mt-2 text-xs">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <span className="text-slate-300">Earned via Good Delivery (14)</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-amber-500"></span>
                        <span className="text-slate-300">Batter Error (5)</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
